name: Validate and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:distribution
      - run: node scripts/verify-extension.mjs
      - run: node scripts/build-reference.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: schema-website-and-downloads
          path: dist/
          retention-days: 30
